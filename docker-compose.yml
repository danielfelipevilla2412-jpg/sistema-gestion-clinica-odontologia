services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: smiletrack-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - smiletrack-sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: smiletrack-web
    container_name: smiletrack-web
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "5258:80"
    environment:
      ASPNETCORE_URLS: "${ASPNETCORE_URLS}"
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT}"
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=SmileTrackDB;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"
    volumes:
      - smiletrack-dataprotection:/root/.aspnet/DataProtection-Keys
    restart: unless-stopped

volumes:
  smiletrack-sqldata:
  smiletrack-dataprotection: